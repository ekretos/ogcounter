name: Build and publish ARM64 image

on:
  push:
    branches: [dev]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "egg/**"
  workflow_dispatch:

concurrency:
  group: ogcounter-arm64-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 image build
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ekretos/ogcounter:arm64
          labels: |
            org.opencontainers.image.source=https://github.com/ekretos/ogcounter
            org.opencontainers.image.title=Counter-Strike 1.6 HLDS ARM64
          cache-from: type=gha
          cache-to: type=gha,mode=max
